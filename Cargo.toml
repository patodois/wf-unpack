[package]
name = "wf-unpack"
version = "0.1.0"
edition = "2021"
description = "Reader for Evolution Engine .toc/.cache packages (Warframe game data)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
oozextract = "0.5.6"
png = "0.18.1"
serde_json = { version = "1", features = ["preserve_order"] }
texture2ddecoder = "0.1.2"
# Packages.bin uses magicless frames, an experimental zstd parameter
zstd = { version = "0.13", features = ["experimental"] }
# Shared model types for crossovers with other game rewrites
rewrite-bridge = { git = "https://github.com/patodois/rewrite-bridge", rev = "0c5d0b0e08fcff58166f2ed6ad3daf9bdc72c0a8", optional = true }

# The F_NOCACHE hint in cache.rs and the peak memory report of check-levels
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
bridge = ["dep:rewrite-bridge"]

[workspace]
members = ["viewer"]

# Oodle decoding and Bevy are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"

# The viewer bakes textures pixel by pixel through the library
[profile.dev.package.wf-unpack]
opt-level = 3
