[package]
name = "wf-unpack"
version = "0.3.1"
edition = "2021"
description = "Reader for Evolution Engine .toc/.cache packages (Warframe game data)"
license = "MIT OR Apache-2.0"
readme = "README.md"
# The fuzz crate needs nightly and is not part of the package; neither are the process reports and reviews
exclude = ["/fuzz", "/CLOUD-REPORT.md", "/docs/reviews"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Block-compression texture decoder (BC1 to BC7), written from the public specifications
bcn-decode = "0.1.0"
# Oodle blocks of the cache files, clean-room (github.com/patodois/lztans)
lztans = "0.1.0"
png = "0.18.1"
serde_json = { version = "1", features = ["preserve_order"] }
# Packages.bin uses magicless frames, an experimental zstd parameter
zstd = { version = "0.13", features = ["experimental"] }
# Shared model types for crossovers with other game rewrites
rewrite-bridge = { version = "0.3.1", optional = true }

# The F_NOCACHE hint in cache.rs and the peak memory report of check-levels
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
bridge = ["dep:rewrite-bridge"]

[workspace]
members = ["viewer"]

# Oodle decoding and Bevy are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"

# The viewer bakes textures pixel by pixel through the library
[profile.dev.package.wf-unpack]
opt-level = 3
