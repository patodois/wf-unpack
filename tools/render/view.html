<!doctype html>
<html><head><meta charset="utf-8"><title>wf-unpack view</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script></head><body>
<script type="module">
// Query parameters (all optional):
//   m        glTF to load (set by shot.cjs)
//   pos tgt fov            camera: "x,y,z", "x,y,z", degrees
//   exp      exposure before the tone mapper (default 1)
//   tm       aces (default) or none (clamped linear)
//   clipy    hide everything above this height (top-down views)
//   bg       background hex; envbg=1 uses the level's fog colour
//   nometal  1 forces metalness 0
//   emis     emissive intensity (default 1)
//   game     1: light level meshes with the game's baked lightmaps, decoded as in
//            src/lightmap.rs (needs the lm<N>_clr/_dir.png pages and the nodes' lightmap extras)
//   lmdebug  1: show the lightmap light alone (albedo 1)
//   dirscale the directional term's gain scale S, which the data does not give (default 0: ambient only)
//   lmboost  scales the lightmap radiance (PostProcessInfo.lightMapBoost; default 1)
//   probe    1: use the zone's reflection probe (probe<N>_equirect.hdr) for reflections
//   env      environment intensity (default 0.25 without probe, 1 with)
//   hemi     hemisphere light intensity (default 0.5 without game=1, 0 with it)
//   dyn      1: add the level's lights as point lights (scaled by ls); default 0 with game=1
//   m2 m2c   a second glTF drawn as wireframe (collision shapes)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const num = (k, d) => q.has(k) ? Number(q.get(k)) : d;
const vec = (k, d) => (q.get(k) ? q.get(k).split(',').map(Number) : d);
const game = q.get('game') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = q.get('tm') === 'none' ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = num('exp', 1.0);
document.body.appendChild(renderer.domElement);
if (q.has('clipy')) { renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), num('clipy', 0))]; }
const scene = new THREE.Scene();
scene.background = new THREE.Color(Number('0x' + (q.get('bg') || '101418')));
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = game ? null : pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const envIntensity = num('env', game ? 1 : 0.25);   // per material: Scene.environmentIntensity does not exist before three r163
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3326, num('hemi', game ? 0 : 0.5)));
const camera = new THREE.PerspectiveCamera(num('fov', 60), innerWidth / innerHeight, 0.05, 2000);
const pos = vec('pos', [0, 5, 0]), tgt = vec('tgt', [0, 0, 0]);
camera.position.set(...pos); camera.lookAt(...tgt);
const lightScale = num('ls', 1);

// ---- the game's lightmap decode, as a patch of MeshStandardMaterial -------------------------
const LM_FRAG_HEAD = /* glsl */`
uniform sampler2D uLmClr; uniform sampler2D uLmDir;
uniform vec4 uLmCoords; uniform vec4 uLmNorm;
uniform vec2 uLmClrSize; uniform vec2 uLmDirSize; uniform float uLmBoost; uniform float uLmDirScale;
varying vec2 vLmUv;
vec4 lmFetch(sampler2D t, ivec2 p, ivec2 sz) { return texelFetch(t, clamp(p, ivec2(0), sz - 1), 0); }
vec4 lmWeights(float f) { return vec4((1.-f)*(1.-f)*(1.-f), 3.*f*f*f - 6.*f*f + 4., -3.*f*f*f + 3.*f*f + 3.*f + 1., f*f*f) / 6.; }
// the cubic B-spline the game's pixel shaders apply to lightmaps
vec4 lmBSpline(sampler2D t, vec2 uv, vec2 size) {
  vec2 x = uv * size - 0.5; vec2 i = floor(x); vec2 f = x - i;
  vec4 wx = lmWeights(f.x), wy = lmWeights(f.y);
  ivec2 sz = ivec2(size), i0 = ivec2(i);
  vec4 acc = vec4(0.);
  for (int b = 0; b < 4; b++) for (int a = 0; a < 4; a++) acc += wx[a] * wy[b] * lmFetch(t, i0 + ivec2(a - 1, b - 1), sz);
  return acc;
}`;
const LM_FRAG_BODY = /* glsl */`
{
  vec2 a = vLmUv * uLmCoords.zw + uLmCoords.xy;
  vec4 clr = lmBSpline(uLmClr, a, uLmClrSize);
  vec3 chroma = clr.rgb * uLmNorm.rgb;
  float luma = clr.a * clr.a * uLmNorm.w;
  vec2 dl = lmBSpline(uLmDir, vec2(0.5 * a.x, a.y), uLmDirSize).rg;
  vec2 dr = lmBSpline(uLmDir, vec2(0.5 * a.x + 0.5, a.y), uLmDirSize).rg;
  vec3 d = vec3(2. * dl.x - 1., 2. * dl.y - 1., 2. * dr.x - 1.);
  d.x = -d.x;                                   // the game's left-handed object space to glTF's
  // S, the directional gain scale, is not identified in the game's data: dirscale (default 0) stands in for it
  float gain = dr.y * dr.y * uLmDirScale;
  vec3 dw = gain * d;
  vec3 nW = inverseTransformDirection(normal, viewMatrix);
  vec3 light = (luma + max(dot(nW, dw), 0.)) * chroma * uLmBoost;
  reflectedLight.indirectDiffuse += light * LM_ALBEDO;
}`;
function patchLightmap(mat, p) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uLmClr = { value: p.clr }; shader.uniforms.uLmDir = { value: p.dir };
    shader.uniforms.uLmCoords = { value: new THREE.Vector4(...p.coords) };
    shader.uniforms.uLmNorm = { value: new THREE.Vector4(...p.normalize) };
    shader.uniforms.uLmClrSize = { value: new THREE.Vector2(p.clr.image.width, p.clr.image.height) };
    shader.uniforms.uLmDirSize = { value: new THREE.Vector2(p.dir.image.width, p.dir.image.height) };
    shader.uniforms.uLmDirScale = { value: p.dirScale };
    shader.uniforms.uLmBoost = { value: p.boost };
    shader.vertexShader = 'attribute vec2 lmUv; varying vec2 vLmUv;\n' + shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vLmUv = lmUv;');
    shader.fragmentShader = LM_FRAG_HEAD + '\n' + shader.fragmentShader.replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\n' + LM_FRAG_BODY.replace('LM_ALBEDO', q.get('lmdebug') === '1' ? 'vec3(1.0)' : 'material.diffuseColor'));
  };
  mat.customProgramCacheKey = () => 'wf-lightmap-v1';
  mat.needsUpdate = true;
}
async function bitmapTexture(url) {
  // Unpremultiplied, no colour conversion: the texels are data (alpha is luma)
  const blob = await (await fetch(url)).blob();
  const bmp = await createImageBitmap(blob, { premultiplyAlpha: 'none', colorSpaceConversion: 'none', imageOrientation: 'none' });
  const t = new THREE.Texture(bmp);
  t.colorSpace = THREE.NoColorSpace; t.flipY = false; t.generateMipmaps = false;
  t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter; t.needsUpdate = true;
  return t;
}
// reflection probe: equirect .hdr in game space -> three's equirect convention (centre = +X), as a PMREM
async function probeEnvironment(url) {
  const tex = await new RGBELoader().setDataType(THREE.FloatType).loadAsync(url);
  const { width: w, height: h } = tex.image, src = tex.image.data, out = new Float32Array(src.length);
  // the file's centre column looks along +Z (x_game to the right); three's looks along +X: shift by a quarter turn
  const shift = Math.round(w * 0.25);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = ((y * w) + ((x - shift + w) % w)) * 4, d = ((y * w) + x) * 4;
    out[d] = src[s]; out[d + 1] = src[s + 1]; out[d + 2] = src[s + 2]; out[d + 3] = 1;
  }
  const t2 = new THREE.DataTexture(out, w, h, THREE.RGBAFormat, THREE.FloatType);
  t2.mapping = THREE.EquirectangularReflectionMapping; t2.colorSpace = THREE.LinearSRGBColorSpace;
  t2.minFilter = THREE.LinearFilter; t2.magFilter = THREE.LinearFilter; t2.flipY = tex.flipY; t2.needsUpdate = true;
  return pmrem.fromEquirectangular(t2).texture;
}

if (q.get('m2')) {
  new GLTFLoader().load(q.get('m2'), (g2) => {
    g2.scene.traverse((o) => { if (o.isMesh) { o.material = new THREE.MeshBasicMaterial({ color: Number('0x' + (q.get('m2c') || '00ff66')), wireframe: true, transparent: true, opacity: 0.6 }); } });
    scene.add(g2.scene);
  });
}
new GLTFLoader().load(q.get('m'), async (gltf) => {
  const root = gltf.scene;
  const lights = [];
  let tris = 0, meshes = 0, lit = 0;
  root.traverse((o) => {
    if (o.isLight) { lights.push(o); return; }
    if (o.isMesh) {
      meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) { m.side = THREE.DoubleSide; if (q.get('nometal') === '1') { m.metalness = 0; } if (q.has('emis')) { m.emissiveIntensity = num('emis', 1); } }
    }
  });
  for (const l of lights) l.parent.remove(l);
  const sc = gltf.scenes[0].userData || {};
  const base = q.get('m').replace(/[^/]*$/, '');
  if (game) {
    const pages = {};
    for (const p of (sc.lightmaps || [])) pages[p.page] = { clr: await bitmapTexture(base + p.clr), dir: p.dir ? await bitmapTexture(base + p.dir) : null };
    const boost = num('lmboost', 1), dirScale = num('dirscale', 0);
    root.traverse((o) => {
      const x = o.userData;
      if (!o.isMesh || !x || !x.lightmap || x.lightmap.page == null) return;
      const l = x.lightmap, pg = pages[l.page];
      if (!pg || !pg.dir || !o.geometry.getAttribute('uv1')) return;
      if (!o.geometry.getAttribute('lmUv')) o.geometry.setAttribute('lmUv', o.geometry.getAttribute('uv1'));
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const out = mats.map((m) => { const c = m.clone(); patchLightmap(c, { clr: pg.clr, dir: pg.dir, coords: l.coords, normalize: l.normalize, dirScale, boost }); return c; });
      o.material = Array.isArray(o.material) ? out : out[0];
      lit++;
    });
  }
  if (q.get('probe') === '1' && (sc.reflectionProbes || []).length) {
    scene.environment = await probeEnvironment(base + sc.reflectionProbes[0].equirect);
  }
  if (!game || scene.environment) root.traverse((o) => { if (o.isMesh) for (const m of (Array.isArray(o.material) ? o.material : [o.material])) m.envMapIntensity = envIntensity; });
  const info = (sc.environments || []).find((e) => e.kind === 'Level' && e.fogColor);
  if (info && q.get('envbg') === '1') scene.background = new THREE.Color(info.fogColor[0] / 255, info.fogColor[1] / 255, info.fogColor[2] / 255).convertSRGBToLinear();
  if (!game || q.get('dyn') === '1') {
    root.traverse((o) => {
      const x = o.userData;
      if (x && x.light && x.on !== false) {
        const c = x.color || [255, 255, 255, 255];
        const col = new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
        const r = x.radius || 10;
        const L = new THREE.PointLight(col, (x.lumens || 1000) / 800 * lightScale, Math.max(r, x.length || 0) * 2, 2);
        o.getWorldPosition(L.position);
        scene.add(L);
      }
    });
  }
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  window.result = { tris, meshes, lightmapped: lit, box: [box.min.toArray(), box.max.toArray()] };
  renderer.render(scene, camera);
  setTimeout(() => { renderer.render(scene, camera); window.done = true; }, q.get('m2') ? 1500 : 0);
}, undefined, (err) => { window.result = { error: String(err) }; window.done = true; });
</script></body></html>
