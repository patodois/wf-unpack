        const col = new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
        const r = x.radius || 10;
        const L = new THREE.PointLight(col, (x.lumens || 1000) / 800 * lightScale, Math.max(r, x.length || 0) * 2, 2);
        o.getWorldPosition(L.position);
        scene.add(L);
      }
    });
  }
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  window.result = { tris, meshes, lightmapped: lit, box: [box.min.toArray(), box.max.toArray()] };
  if (q.get('post') === 'game') {
    window.result.exposure = await gamePost(sc);
    window.done = true;
    return;
  }
  if (q.get('pano') === '1') {
    const rt = new THREE.WebGLCubeRenderTarget(1024, { type: THREE.HalfFloatType });
    const cc = new THREE.CubeCamera(0.05, 2000, rt); cc.position.set(...pos); scene.add(cc); cc.update(renderer, scene);
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      uniforms: { cube: { value: rt.texture } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
      fragmentShader: `varying vec2 vUv; uniform samplerCube cube;
        void main(){
          float az = (vUv.x - 0.5) * 6.2831853, el = (vUv.y - 0.5) * 3.1415927;   // vUv.y 1 is the top
          vec3 d = vec3(cos(el) * sin(az), sin(el), -cos(el) * cos(az));
          gl_FragColor = vec4(textureCube(cube, d).rgb, 1.);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`, depthTest: false, depthWrite: false }));
    const s2 = new THREE.Scene(); s2.add(quad);
    renderer.render(s2, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
    window.done = true;
    return;
  }
  renderer.render(scene, camera);
  setTimeout(() => { renderer.render(scene, camera); window.done = true; }, q.get('m2') ? 1500 : 0);
}, undefined, (err) => { window.result = { error: String(err) }; window.done = true; });
</script></body></html>
