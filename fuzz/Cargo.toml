[package]
name = "wf-unpack-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "cargo-fuzz targets for wf-unpack (nightly only; not part of the workspace, the package or CI)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wf-unpack = { path = ".." }

# Not a member of the root workspace: the root build, the published package and CI never see this crate
[workspace]

[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

[[bin]]
name = "animation"
path = "fuzz_targets/animation.rs"
test = false
doc = false
bench = false

